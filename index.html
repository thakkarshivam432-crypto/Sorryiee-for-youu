<!DOCTYPE html>
<html>
<head>
<title>For You ❤️</title>

<style>
body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#ffdde1;
font-family:Arial;
flex-direction:column;
overflow:hidden;
}

h1{
color:#ff0066;
}

.heart{
font-size:120px;
animation:beat 1s infinite;
}

@keyframes beat{
0%{transform:scale(1);}
50%{transform:scale(1.2);}
100%{transform:scale(1);}
}
</style>

</head>

<body>

<div class="heart">❤️</div>

<h1>Please Smile 🥺</h1>

<p>I have something special for you...</p>

</body>
</html>
